<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function show()
        {
            var cname=document.getElementById("city").value;
           var api=`https://api.openweathermap.org/data/2.5/weather?q=${cname}&appid=7159965ca9d39175841e0594b320c9f8`;
        //    document.getElementById("res").innerHTML=api;
           fetch(api)
           .then((response)=>response.json())

           .then((data)=>
           {
     console.log(data);
            document.getElementById("res1").innerHTML=data.weather[0].main;
            document.getElementById("res2").innerHTML=data.weather[0].description;
            document.getElementById("res3").innerHTML=data.wind.speed;
            document.getElementById("res4").innerHTML=data.main.temp;
            document.getElementById("res5").innerHTML=data.main.humidity;
        })
        
           .catch((err)=>{
            console.log(""+err);
            document.getElementById("sid").style.display="none";
            document.getElementById("res7").innerHTML=" ❌city Not Found ";

        })
}
</script>
<style type="text/css">
    body{
        background-image: url("./images/weather.jfif");
        background-size:cover;
    }
    h3
    {
        background-color: red;
        border-radius: 100px;
        border:5px solid rgb(160, 218, 112);
        font-size:15px;
    }
    #author
    {
        color:red;
    }
    #sid
    {
        text-align:left;
        background-color:greenyellow;
        width:65%;
        border-radius:10px;
        padding:10px;
        box-shadow:15px 15px 15px 1px slateblue;
        opacity:.6;
    }

</style>
</head>
<body>
    <center>
        <h1>Live Weather Report By Using City Name<span> Created By Sudha</span></h1>
    

    <input type="text" id="city" placeholder="Enter your city Name">
    <br>
    <button onclick="show()">Clickme</button>
    <div id="res"></div>
    <div id="sid">
    Main Weather Report:<span id="res1"></span>
        <br>Detailed Weather Report:<span id="res2"></span>
       <br> Wind Speed:<span id="res3"></span>
       <br> Temperature:<span id="res4"></span>
        <br>Humidity:<span id="res5"></span>
         </div>
        <div id="res7"></div>
   </center>

    
</body>
</html>
